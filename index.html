<!doctype html>
<html lang="en">
  <head>
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload LCP Image -->
    <link rel="preload" as="image" href="/sejal.png" />

    <!-- SEO Meta Tags -->
    <title>Sejal Mahadik | UXBySejal Portfolio | Netlify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Sejal Mahadik is a UI/UX Engineer and Frontend Developer based in India. Explore her portfolio, projects, design systems, and web applications hosted on Netlify."
    />
    <link rel="canonical" href="https://sejalmahadik.netlify.app/" />
    <meta
      name="keywords"
      content="Sejal Mahadik, Sejal Mahadik Netlify, UI UX Engineer India, Frontend Developer Portfolio, UX Designer India"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sejalmahadik.netlify.app/" />
    <meta
      property="og:title"
      content="Sejal Mahadik | UI UX Engineer & Frontend Developer"
    />
    <meta property="og:description" content="Portfolio showcasing." />
    <meta property="og:image" content="/sejal.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeBySejal" />
    <meta name="twitter:description" content="UI/UX Engineer portfolio." />
    <meta name="twitter:image" content="/sejal.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sejal Mahadik",
        "url": "https://sejalmahadik.netlify.app/",
        "jobTitle": "UI UX Engineer",
        "description": "UI/UX Engineer and Frontend Developer based in India.",
        "sameAs": [
          "https://in.linkedin.com/in/sejal-mahadik-69b546170",
          "https://github.com/sejal0115",
          "https://dev.to/codedbysejal"
        ]
      }
    </script>
    <script>
      (() => {
        const theme = localStorage.getItem("theme") || "dark";
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
